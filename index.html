<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Design Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { margin-top: 0; color: var(--accent); }
        p { color: var(--text-muted); line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mechanical Design Engineer</h1>
        <p>Specializing in Special Purpose Machines, Industrial Automation, and 3D CAD Modeling.</p>
        <p>Portfolio under construction. Launching via Vercel / GitHub Pages soon!</p>
        <a href="mailto:your_email@example.com" class="btn">Get in Touch</a>
    </div>

</body>
</html>
